{% load crispy_forms_tags %}
<form method="post" action="{{ modal_action }}" class="quick-add-form" novalidate>
  {% csrf_token %}
  <div class="qa-head">
    <span class="fw-600">{{ modal_title }}</span>
    <button type="button" class="btn btn-ghost btn-icon btn-sm" data-qa-close aria-label="Close"><i class="bi bi-x-lg"></i></button>
  </div>
  <div class="qa-body">
    {% if modal_subtitle %}<div class="subtle mb-2">{{ modal_subtitle }}</div>{% endif %}
    {% if form.non_field_errors %}<div class="alert alert-danger"><i class="bi bi-exclamation-octagon"></i><div>{{ form.non_field_errors }}</div></div>{% endif %}
    {{ form|crispy }}
    {% if modal_note %}<p class="small subtle mb-0">{{ modal_note }}</p>{% endif %}
  </div>
  <div class="qa-foot">
    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> {{ modal_submit }}</button>
    <button type="button" class="btn btn-ghost" data-qa-close>Cancel</button>
  </div>
</form>
