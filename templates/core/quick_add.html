{% load crispy_forms_tags %}
<form method="post" action="{% url 'quick_add' kind %}" class="quick-add-form" novalidate>
  {% csrf_token %}
  <div class="qa-head">
    <span class="fw-600">{{ title }}</span>
    <button type="button" class="btn btn-ghost btn-icon btn-sm" data-qa-close aria-label="Close"><i class="bi bi-x-lg"></i></button>
  </div>
  <div class="qa-body">
    {% if form.non_field_errors %}<div class="alert alert-danger"><i class="bi bi-exclamation-octagon"></i><div>{{ form.non_field_errors }}</div></div>{% endif %}
    {{ form|crispy }}
  </div>
  <div class="qa-foot">
    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
    <button type="button" class="btn btn-ghost" data-qa-close>Cancel</button>
  </div>
</form>
