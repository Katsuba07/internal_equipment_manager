{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Change password — {{ APP_NAME }}{% endblock %}

{% block content %}
<div style="max-width:520px">
  <div class="page-head">
    <div><h1>Change password</h1></div>
  </div>
  <div class="card">
    <div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <div class="row-flex mt-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-lg"></i> Save new password
          </button>
          <a href="{% url 'dashboard' %}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
