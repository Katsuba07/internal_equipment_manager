{% extends "base.html" %}

{% block title %}Password changed — {{ APP_NAME }}{% endblock %}

{% block content %}
<div style="max-width:520px">
  <div class="card">
    <div class="empty">
      <i class="bi bi-check-circle text-success" style="font-size:2.4rem"></i>
      <div class="title">Password changed</div>
      <div class="desc">Use your new password the next time you sign in.</div>
      <div class="actions">
        <a href="{% url 'dashboard' %}" class="btn btn-primary">Back to overview</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
